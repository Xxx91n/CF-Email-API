name = "cf-email-api"
main = "src/index.ts"
compatibility_date = "2026-04-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
DEFAULT_TTL = "600"
DEFAULT_TTL_UNIT = "seconds"
ENABLE_AI = "true"
REQUIRE_AUTH = "false"
FILTER_MODE = "none"
FILTER_LIST = ""
# AUTH_TOKEN is a secret, not a var: run "wrangler secret put AUTH_TOKEN"
# when REQUIRE_AUTH is "true" (a same-named [vars] entry would replace the
# secret on deploy)

[[kv_namespaces]]
binding = "EMAIL_KV"
id = "055e6d68a3eb4841a282ff679b63026f"

[ai]
binding = "AI"
